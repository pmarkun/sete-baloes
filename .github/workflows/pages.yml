name: Publicar jogos

on:
  push:
    branches:
      - codex/sete-baloes-v2
      - feat/casa-na-arvore
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validar mecânicas e JavaScript
        run: |
          node treehouse/engine.test.mjs
          node --check treehouse/app.mjs
          node --check treehouse/render.mjs

      - name: Preparar os dois jogos
        run: |
          mkdir -p _site
          cp index.html menu.css _site/
          cp -r game treehouse _site/

      - name: Empacotar jogos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
