<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#21151e">
<title>Casa na Árvore de X Andares</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<body>
<main class="shell">
  <header><a href="../" aria-label="Menu de jogos">☰</a><h1>Casa na Árvore<span>de X Andares</span></h1><div class="header-tools"><button id="sound" aria-label="Silenciar música e efeitos" aria-pressed="true">♪</button><button id="pause" aria-label="Pausar jogo">Ⅱ</button></div></header>
  <div class="world"><canvas width="240" height="360" aria-label="Menina explorando o interior da árvore. Use as setas para andar e escalar, espaço para pular e E para interagir."></canvas>
    <section id="overlay"><div><p id="overlay-number">UMA CASA AINDA CRESCENDO</p><h2 id="overlay-title">O próximo galho<br>é só o começo.</h2><p id="overlay-copy">Dezesseis andares, um segredo no tempo<br>e um lugar lá no alto.</p><button id="continue" disabled>CARREGANDO ARTE…</button><button id="restart" hidden>RECOMEÇAR DO PRIMEIRO</button><div id="dev-tools"><label for="dev-floor">DESENVOLVEDOR · abrir fase</label><select id="dev-floor" aria-label="Escolher fase para testar"></select><button id="dev-start" type="button">ABRIR FASE</button></div><p class="keyboard">Setas / WASD · espaço: pular · E: ação</p></div></section>
  </div>
  <footer><h2 id="floor">01 / 16 · Primeiros galhos</h2><p id="hint" aria-live="polite"></p><div class="controls"><div class="dpad"><button data-key="up" aria-label="Subir escada">▲</button><button data-key="left" aria-label="Andar para a esquerda">◀</button><button data-key="down" aria-label="Descer escada">▼</button><button data-key="right" aria-label="Andar para a direita">▶</button></div><div class="actions"><button data-key="action">AÇÃO</button><button data-key="jump" class="jump">PULAR</button></div></div></footer>
</main>
<script type="module" src="app.mjs"></script>
</body></html>
